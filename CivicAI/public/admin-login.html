
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CivicAI - Admin Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #123456, #2878a8);
            padding: 20px;
        }

        .login-container {
            background: white;
            width: 100%;
            max-width: 400px;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        .logo {
            text-align: center;
            color: #1769aa;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        h2 {
            text-align: center;
            margin-bottom: 8px;
            color: #222;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #1769aa;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 22px;
            border: none;
            border-radius: 7px;
            background: #1769aa;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #104d80;
        }

        .message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            color: #b42318;
        }

        .footer {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
        }

        .footer a {
            color: #1769aa;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">CivicAI</div>

        <h2>Administrator Login</h2>

        <p class="subtitle">
            From Complaints to Action
        </p>

        <form id="adminLoginForm">

            <label for="email">Admin Email ID</label>
            <input
                type="email"
                id="email"
                placeholder="Enter admin email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter password"
                required
            >

            <button type="submit">Sign In</button>

            <p class="message" id="message"></p>

        </form>

        <div class="footer">
            <a href="index.html">Back to Home</a>
        </div>

    </div>

    <script>
        document.getElementById("adminLoginForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                document.getElementById("message").textContent =
                    "Admin authentication is not connected yet. Firebase setup is required.";
            });
    </script>

</body>
</html>
